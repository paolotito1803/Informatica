<header class="dashboard-header">
  <h2 class="title">
    <!-- Logo dinamico -->
    <img
      *ngIf="companyLogo"
      [src]="companyLogo"
      alt="{{ airlineName }} Logo"
      class="company-logo"
    />

    Dashboard
    <span  class="username">{{ username }}</span>
  </h2>

  <button
    class="logout-btn"
    (click)="logout()"
    aria-label="Logout"
    title="Esci dal Dashboard"
  >
    <img
      src="../../../assets/Interface_icons/user-logout.svg"
      alt="Logout"
      class="icon"
    />
  </button>
</header>

<div *ngIf="adminRole">
  <app-admin></app-admin>
</div>

<div *ngIf="airlineRole">
  <app-airlines></app-airlines>

<section class="tickets-section">
  <h3 class="section-title">🎫 I tuoi Biglietti</h3>
  <button class="btn add-btn" (click)="aggiungiBiglietto()">➕ Aggiungi Biglietto</button>

  <div *ngIf="tickets.length > 0; else noTickets" class="tickets-list">
    <div *ngFor="let t of tickets; let i = index" class="ticket-card">

      <!-- 3.1) FORM A VIDEO -->
      <div *ngIf="t.editing; else showTicket" class="ticket-form">
        <div class="form-field"> 
          <label>Codice:</label> 
          <input [(ngModel)]="t._code" placeholder="Codice Biglietto" /> 
        </div> 
        <div class="form-field"> 
          <label>Volo:</label> 
          <input [(ngModel)]="t.flight" placeholder="Codice volo" /> 
        </div> 
        <div class="form-field"> 
          <label>Posto:</label> 
          <input [(ngModel)]="t.seat" placeholder="Numero posto" /> 
        </div> 
        <div class="form-field"> 
          <label>Prezzo:</label> 
          <input type="number" [(ngModel)]="t.price" min="0" /> 
        </div> <div class="form-field"> 
          <label>Bagagli:</label> 
          <input type="number" [(ngModel)]="t.numBag" min="0" /> 
        </div> <div class="form-field"> <label>Utente:</label> 
          <input [(ngModel)]="t.user" placeholder="Mail utente" /> 
        </div>
        <div class="form-actions">
          <button class="btn save-btn" (click)="salvaBiglietto(i)">💾 Salva</button>
          <button class="btn save-change-btn" (click)="updateTickets(t)">💾 Aggiorna lista biglietti</button>
          <button class="btn cancel-btn" (click)="t.editing = false">❌ Annulla</button>
        </div>
      </div>

      <!-- 3.2) VISTA STATICA -->
      <ng-template #showTicket>
        <div class="ticket-info">
          <p><strong>Codice:</strong> {{ t._code }}</p> 
          <p><strong>Utente:</strong> {{ t.user }}</p> 
          <p><strong>Volo:</strong> {{ t.flight }}</p> 
          <p><strong>Posto:</strong> {{ t.seat }}</p> 
          <p><strong>Prezzo:</strong> {{ t.price }}€</p> 
          <p><strong>Bagagli:</strong> {{ t.numBag }}</p>
          <div class="form-actions">
            <button class="btn edit-btn" (click)="t.editing = true">✏️ Modifica</button>
            <button class="btn delete-btn" (click)="deleteTickets(t)">🗑️ Elimina</button>
          </div>
        </div>
      </ng-template>

    </div>
  </div>

  <ng-template #noTickets>
    <p class="empty-message">Non ci sono biglietti disponibili.</p>
  </ng-template>
</section>




  <ng-template #noTickets>
    <p>Non ci sono biglietti</p>
  </ng-template>
  <app-routes></app-routes>
</div>
