<div class="signup-container">
  <div class="signup-card">
    <div class="signup-header">
      <i class="fas fa-user-plus signup-icon"></i>
      <h2>Sign Up</h2>
    </div>

    <form #signupForm="ngForm" (ngSubmit)="signup()" novalidate>
      
      <!-- Email -->
      <div class="form-group">
        <div class="input-icon"><i class="fas fa-envelope"></i></div>
        <input
          type="email"
          name="mail"
          #mail="ngModel"
          [(ngModel)]="user.mail"
          class="form-control"
          placeholder="Email address"
          required
          email
        />
      </div>
      <div *ngIf="mail.invalid && (mail.dirty || mail.touched)" class="error-text">
        <i class="fas fa-exclamation-circle"></i>
        Inserisci un indirizzo email valido
      </div>

      <!-- Username -->
      <div class="form-group">
        <div class="input-icon"><i class="fas fa-user"></i></div>
        <input
          type="text"
          name="username"
          #username="ngModel"
          [(ngModel)]="user.username"
          class="form-control"
          placeholder="Username"
          required
        />
      </div>
      <div *ngIf="username.invalid && (username.dirty || username.touched)" class="error-text">
        <i class="fas fa-exclamation-circle"></i>
        Username obbligatorio
      </div>

      <!-- Password -->
      <div class="form-group">
        <div class="input-icon"><i class="fas fa-lock"></i></div>
        <input
          type="password"
          name="password"
          #password="ngModel"
          [(ngModel)]="user.password"
          class="form-control"
          placeholder="Password"
          required
        />
      </div>
      <div *ngIf="password.invalid && (password.dirty || password.touched)" class="error-text">
        <i class="fas fa-exclamation-circle"></i>
        Password obbligatoria
      </div>

      <!-- Ruolo -->
      <div class="form-group">
        <div class="input-icon"><i class="fas fa-user-tag"></i></div>
        <input
          type="text"
          name="roles"
          #roles="ngModel"
          [(ngModel)]="user.roles"
          class="form-control"
          placeholder="Ruolo"
          required
        />
      </div>
      <div *ngIf="roles.invalid && (roles.dirty || roles.touched)" class="error-text">
        <i class="fas fa-exclamation-circle"></i>
        Ruolo obbligatorio
      </div>

      <!-- PassportID -->
      <div class="form-group">
        <div class="input-icon"><i class="fas fa-passport"></i></div>
        <input
          type="text"
          name="passportID"
          #passportID="ngModel"
          [(ngModel)]="user.passportID"
          class="form-control"
          placeholder="PassportID"
          required
        />
      </div>
      <div *ngIf="passportID.invalid && (passportID.dirty || passportID.touched)" class="error-text">
        <i class="fas fa-exclamation-circle"></i>
        PassportID obbligatorio
      </div>

      <!-- Messaggio di errore generale -->
      <div *ngIf="errmessage" class="error-text general-error">
        <i class="fas fa-exclamation-triangle"></i>
        Signup error: {{ errmessage }}
      </div>

      <!-- Pulsante -->
      <button
        type="submit"
        class="btn btn-primary btn-block"
        [disabled]="!signupForm.form.valid"
      >
        <i class="fas fa-user-check"></i> Sign Up
      </button>
    </form>
  </div>
</div>
