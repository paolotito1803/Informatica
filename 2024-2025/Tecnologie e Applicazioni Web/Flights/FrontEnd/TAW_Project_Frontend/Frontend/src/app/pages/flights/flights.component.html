<div class="container">
  <h2><img src="../../../assets/Interface_icons/plane-departure.png" width="35" height="35"/> Add Flight</h2>
  <form (submit)="addFlight(); $event.preventDefault()" class="form">
    <input [(ngModel)]="newFlight._flightCode" name="flightCode" placeholder="Flight Code" required>
    <input [(ngModel)]="newFlight.route" name="route" placeholder="Route ID" required>
    <input [(ngModel)]="newFlight.aircraft" name="aircraft" placeholder="Aircraft Code" required>
    <input [(ngModel)]="newFlight.duration" name="duration" type="number" placeholder="Duration (min)" required>
    <input [(ngModel)]="newFlight.dataOra" name="dataOra" type="datetime-local" required>
    <button type="submit" class="btn add"><i class="fas fa-plus"></i>Add</button>
  </form>

  <h2><i class="fas fa-list"></i> Flights List</h2>
  <div class="table-wrapper">
    <table class="flight-table">
      <thead>
        <tr>
          <th>Flight Code</th>
          <th>Route</th>
          <th>Aircraft</th>
          <th>Duration</th>
          <th>Date & Time</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let flight of flights">
          <td>{{ flight._flightCode }}</td>
          <td>{{ flight.route }}</td>
          <td>{{ flight.aircraft }}</td>
          <td>{{ flight.duration }}</td>
          <td>{{ flight.dataOra | date: 'yyyy-MM-dd HH:mm' }}</td>
          <td>
            <button class="btn edit" (click)="editFlight(flight)"><img src="../../../assets/Interface_icons/pencil.png" height="20" width="20"/></button>
            <button class="btn delete" (click)="deleteFlight(flight._flightCode)"><i class="fas fa-trash"></i></button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <div *ngIf="editedFlight" class="edit-section">
    <h2><i class="fas fa-edit"></i> Edit Flight</h2>
    <form (submit)="saveFlightChanges(); $event.preventDefault()" class="form">
      <input [(ngModel)]="editedFlight.route" name="editRoute" placeholder="Route ID" required>
      <input [(ngModel)]="editedFlight.aircraft" name="editAircraft" placeholder="Aircraft Code" required>
      <input [(ngModel)]="editedFlight.duration" name="editDuration" type="number" placeholder="Duration (min)" required>
      <input [(ngModel)]="editedFlight.dataOra" name="editDataOra" type="datetime-local" required>
      <button type="submit" class="btn save"><i class="fas fa-save"></i> Save</button>
      <button type="button" class="btn cancel" (click)="cancelEdit()"><i class="fas fa-times"></i> Cancel</button>
    </form>
  </div>
</div>
