<div class="login-container">
  <form class="login-form" (ngSubmit)="login(mailtxt.value, passwdtxt.value, checkr.checked)">
    
    <div class="logo-wrapper">
      <i class="fas fa-envelope-open-text login-logo"></i>
    </div>
    
    <h1 class="form-title">Sign In</h1>
    
    <div class="input-group">
      <i class="fas fa-user"></i>
      <input
        type="email"
        #mailtxt
        placeholder="Email address"
        required
        autofocus
      />
    </div>
    
    <div class="input-group">
      <i class="fas fa-lock"></i>
      <input
        type="password"
        #passwdtxt
        placeholder="Password"
        required
      />
    </div>
    
    <div class="checkbox-group">
      <input type="checkbox" #checkr id="rememberMe" />
      <label for="rememberMe">Remember me</label>
    </div>
    
    <div *ngIf="errmessage" class="error-msg">
      <i class="fas fa-exclamation-circle"></i>
      {{ errmessage }}
    </div>
    
    <button type="submit" class="btn btn-primary">
      <i class="fas fa-sign-in-alt"></i> Sign in
    </button>
    
    <p class="signup-link">
      <a routerLink="/signup">Sign-up new user</a>
    </p>
    
    <p class="footer-text">&copy; 2017–2025</p>
  </form>
</div>
