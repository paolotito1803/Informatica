<div class="container">
  <div *ngIf="!mustChangePassword">
    <button (click)="switchToUpdate()">Aggiorna Dati Compagnia</button>
    <button (click)="switchToSetup()">Cambia Password / Setup</button>
  </div>

  <div *ngIf="!showSetup">
    <h2>Aggiorna Compagnia Aerea</h2>
    <form>
      <div><label>Nome:</label><input [(ngModel)]="airlineName" name="airlineName"></div>
      <div><label>Revenue:</label><input type="number" [(ngModel)]="airlineRevenue" name="airlineRevenue"></div>
      <div><h4>Aerei</h4>
        <div *ngFor="let ac of updateData.aircrafts; let i = index" style="border:1px solid #ccc;padding:8px;margin:8px 0;">
          <input placeholder="Numero Aereo" [(ngModel)]="ac._numAircraft" name="numA_update{{i}}">
          <input placeholder="Modello" [(ngModel)]="ac.modello" name="modello_update{{i}}">
          <div *ngFor="let s of ac.seats; let j=index" style="margin:4px 0;">
            <input placeholder="Numero Seat" [(ngModel)]="s._numSeat" name="seatNum_update{{i}}_{{j}}">
            <input placeholder="Classe" [(ngModel)]="s.class" name="class_update{{i}}_{{j}}">
            <label><input type="checkbox" [(ngModel)]="s.legroom" name="leg_update{{i}}_{{j}}"> Legroom</label>
            <label><input type="checkbox" [(ngModel)]="s.isFree" name="isFree_update{{i}}_{{j}}"> Libero</label>
            <button type="button" (click)="removeSeat(i,j)">Rimuovi Seat</button>
          </div>
          <button type="button" (click)="addSeat(i)">Aggiungi Seat</button>
          <button type="button" (click)="removeAircraft(i)">Rimuovi Aereo</button>
        </div>
        <button type="button" (click)="updateAirlines()">Aggiorna Dati</button>
        <button type="button" (click)="addAircraft()">Aggiungi Aereo</button>
      </div>
      <button type="button" (click)="updateInfo()">Aggiorna Aerei</button>
    </form>
  </div>

  <div *ngIf="showSetup">
    <h2>{{ mustChangePassword ? 'Primo accesso: completa il setup' : 'Setup / Cambia Password' }}</h2>
    <form>
      <div><label>Nome:</label><input [(ngModel)]="setupData.name" name="name_s"></div>
      <div><label>Mail:</label><input type="email" [(ngModel)]="setupData.mail" name="mail_s"></div>
      <div><label>Password:</label><input type="password" [(ngModel)]="setupData.password" name="pwd_s"></div>
      <div><h4>Aerei</h4>
        <div *ngFor="let ac of setupData.aircrafts; let i=index" style="border:1px solid #ccc;padding:8px;margin:8px 0;">
          <input placeholder="Numero Aereo" [(ngModel)]="ac._numAircraft" name="numA_s{{i}}">
          <input placeholder="Modello" [(ngModel)]="ac.modello" name="modello_s{{i}}">
          <div *ngFor="let s of ac.seats; let j=index" style="margin:4px 0;">
            <input placeholder="Numero Seat" [(ngModel)]="s._numSeat" name="seatNum_s{{i}}_{{j}}">
            <input placeholder="Classe" [(ngModel)]="s.class" name="class_s{{i}}_{{j}}">
            <label><input type="checkbox" [(ngModel)]="s.legroom" name="leg_s{{i}}_{{j}}"> Legroom</label>
            <label><input type="checkbox" [(ngModel)]="s.isFree" name="free_s{{i}}_{{j}}"> Libero</label>
            <button type="button" (click)="removeSetupSeat(i,j)">Rimuovi Seat</button>
          </div>
          <button type="button" (click)="addSetupSeat(i)">Aggiungi Seat</button>
          <button type="button" (click)="removeSetupAircraft(i)">Rimuovi Aereo</button>
        </div>
        <button type="button" (click)="addSetupAircraft()">Aggiungi Aereo</button>
      </div>
      <button type="button" (click)="setupAirline()">Completa Setup</button>
    </form>
  </div>
</div>
