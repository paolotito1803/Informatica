<div class="container">
  <div *ngIf="!mustChangePassword" class="company-actions">
  <button class="btn action" (click)="switchToUpdate()">
    ✏️ Modifica Dati Compagnia
  </button>
  <button class="btn action" (click)="switchToSetup()">
    🔐 Cambia Password / Setup
  </button>
</div>


  <div *ngIf="!showSetup">
    <h2>Compagnia Aerea</h2>
    <form class="form-container">

  <!-- Airline Info -->
  <div class="field-group">
    <label>
      <img class="icon" src="../../../assets/Interface_icons/user.svg" alt="Nome">
      Nome
    </label>
    <input
      [(ngModel)]="airlineName"
      name="airlineName"
      placeholder="Inserisci nome compagnia">
  </div>

  <div class="field-group">
    <label>
      <img class="icon" src="../../../assets/Interface_icons/revenue.svg" alt="Revenue">
      Revenue
    </label>
    <input
      type="number"
      [(ngModel)]="airlineRevenue"
      name="airlineRevenue"
      placeholder="Inserisci revenue">
  </div>

  <!-- Aircrafts Section -->
  <div class="aircrafts-section">
    <h4>
      <img class="icon" src="../../../assets/Interface_icons/plane.svg" alt="Aerei">
      Aerei
    </h4>

    <div *ngFor="let ac of updateData.aircrafts; let i = index" class="aircraft-card">

      <!-- ▶ VISUALIZZAZIONE -->
      <ng-container *ngIf="!ac.editing">
        <div class="aircraft-info">
          <p><strong>Numero Aereo:</strong> {{ ac._numAircraft || 'N/A' }}</p>
          <p><strong>Modello:</strong> {{ ac.modello || 'N/A' }}</p>
        </div>

        <ul class="seat-list">
          <li *ngFor="let s of ac.seats" class="seat-item">
            <span><img src="../../../assets/Interface_icons/seat-airline.svg" class="icon"/> <strong>{{ s._numSeat }}</strong> {{ s.class }}</span>
            <span><img src="../../../assets/Interface_icons/legroom.svg" class="icon"/> {{ s.legroom ? 'Sì' : 'No' }}</span>
            <span><img src="../../../assets/Interface_icons/free_seat.svg" class="icon"/> {{ s.isFree ? 'Sì' : 'No' }}</span>
          </li>
        </ul>

        <div class="actions">
          <button class="btn edit" (click)="startEditAircraft(i)">✏️ Modifica</button>
          <button class="btn delete" (click)="removeAircraft(i)">🗑️ Elimina</button>
        </div>
      </ng-container>

      <!-- 🛠 MODIFICA -->
      <ng-container *ngIf="ac.editing">
        <div class="aircraft-header">
          <input class="input aircraft-number" [(ngModel)]="ac._numAircraft" name="num{{i}}" placeholder="Numero Aereo">
          <input class="input aircraft-model" [(ngModel)]="ac.modello" name="modello{{i}}" placeholder="Modello">
        </div>

        <div class="seats-container">
          <div *ngFor="let s of ac.seats; let j = index" class="seat-row">
            <!-- campi modificabili -->
            <input [(ngModel)]="s._numSeat" name="seatNum{{i}}_{{j}}" placeholder="Numero Seat">
            <input [(ngModel)]="s.class" name="class{{i}}_{{j}}" placeholder="Classe">
            <label><input type="checkbox" [(ngModel)]="s.legroom" name="leg{{i}}_{{j}}"> Legroom</label>
            <label><input type="checkbox" [(ngModel)]="s.isFree" name="free{{i}}_{{j}}"> Libero</label>
            <button type="button" class="btn remove-seat" (click)="removeSeat(i,j)">−</button>
          </div>
          <button type="button" class="btn add-seat" (click)="addSeat(i)">+ Aggiungi Seat</button>
        </div>

        <!-- Pulsanti azione -->
        <div class="actions">
          <button class="btn save" (click)="saveAircraft(i)">💾 Salva Modifiche</button>
          <button class="btn cancel" (click)="cancelEditAircraft(i)">❌ Annulla</button>
          <button class="btn delete" (click)="removeAircraft(i)">🗑️ Elimina</button>
        </div>
      </ng-container>

    </div>


    <!-- Aircraft-level Actions -->
    <div class="aircraft-actions">
      <button
        type="button"
        class="btn update-aircraft"
        (click)="updateInfo()">
        <img class="icon" src="../../../assets/Interface_icons/save.svg" alt="Aggiorna">
        Conferma Aggiunta Aerei
      </button>
      <button
        type="button"
        class="btn add-aircraft"
        (click)="addAircraft()">
        <img class="icon" src="../../../assets/Interface_icons/plus.svg" alt="+">
        Aggiungi Aereo
      </button>
    </div>
  </div>

  

  <!-- Form-level Action -->
  <button
    type="button"
    class="btn update-all"
    (click)="updateAirlines()">
    <img class="icon" src="../../../assets/Interface_icons/save.svg" alt="Aggiorna">
    Aggiorna Dati Compagnia
  </button>
</form>

  </div>

  <div *ngIf="showSetup">
    <h2>{{ mustChangePassword ? 'Primo accesso: completa il setup' : 'Setup / Cambia Password' }}</h2>
    <form>
      <div><label>Nome:</label><input [(ngModel)]="setupData.name" name="name_s"></div>
      <div><label>Mail:</label><input type="email" [(ngModel)]="setupData.mail" name="mail_s"></div>
      <div><label>Password:</label><input type="password" [(ngModel)]="setupData.password" name="pwd_s"></div>
      <div class="aircrafts-container">
  <h4>
    <img class="icon" src="../../../assets/Interface_icons/plane.svg" alt="Aereo">
    Aerei
  </h4>

  <div *ngFor="let ac of setupData.aircrafts; let i = index" class="aircraft-card">

    <!-- Header Aereo -->
    <div class="aircraft-header">
      <input class="input aircraft-number"
             [(ngModel)]="ac._numAircraft"
             name="numA_s{{ i }}"
             placeholder="Numero Aereo">
      <input class="input aircraft-model"
             [(ngModel)]="ac.modello"
             name="modello_s{{ i }}"
             placeholder="Modello">
      <button class="icon-btn remove-aircraft"
              (click)="removeSetupAircraft(i)"
              title="Rimuovi Aereo">
        <img class="icon" src="../../../assets/Interface_icons/delete.svg" alt="Rimuovi">
      </button>
    </div>

    <!-- Lista seats -->
    <div class="seats-container">
      <div *ngFor="let s of ac.seats; let j = index" class="seat-row">
        <img class="icon seat-icon" src="../../../assets/Interface_icons/seat-airline.svg" alt="Seat">
        <input class="input seat-number"
               [(ngModel)]="s._numSeat"
               name="seatNum_s{{ i }}_{{ j }}"
               placeholder="Numero Seat">
        <input class="input seat-class"
               [(ngModel)]="s.class"
               name="class_s{{ i }}_{{ j }}"
               placeholder="Classe">
        <label class="checkbox-label">
          <input type="checkbox"
                 [(ngModel)]="s.legroom"
                 name="leg_s{{ i }}_{{ j }}">
          Legroom
        </label>
        <label class="checkbox-label">
          <input type="checkbox"
                 [(ngModel)]="s.isFree"
                 name="free_s{{ i }}_{{ j }}">
          Libero
        </label>
        <button class="icon-btn remove-seat"
                (click)="removeSetupSeat(i, j)"
                title="Rimuovi Seat">
          <img class="icon" src="../../../assets/Interface_icons/minus.svg" alt="–">
        </button>
      </div>

      <button class="btn add-seat" (click)="addSetupSeat(i)">
        <img class="icon" src="../../../assets/Interface_icons/plus.svg" alt="+">
        Aggiungi Seat
      </button>
    </div>

  </div>

  <button class="btn add-aircraft" (click)="addSetupAircraft()">
    <img class="icon" src="../../../assets/Interface_icons/plus.svg" alt="+">
    Aggiungi Aereo
  </button>
</div>

      <button type="button" (click)="setupAirline()">Completa Setup</button>
    </form>
  </div>

  <app-flights></app-flights>
</div>
