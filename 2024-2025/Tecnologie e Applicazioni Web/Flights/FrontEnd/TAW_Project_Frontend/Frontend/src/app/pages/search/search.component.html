<div class="search-container">
  <h2>Ricerca Voli</h2>
  <input [(ngModel)]="depart" placeholder="Partenza" />
  <input [(ngModel)]="destination" placeholder="Destinazione" />

  <button (click)="search()">Cerca voli</button>
</div>

<div *ngIf="loading">Caricamento...</div>

<div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>

<div *ngIf="results.length > 0">
  <h3>Risultati:</h3>
  <ul>
    <li *ngFor="let flight of results">
      {{ flight.depart }} → {{ flight.destination }} - {{ flight.cost }}€ - {{ flight.duration }}h
    </li>
  </ul>
</div>
