
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Aggiorna prodotto</title>
</head>
<body>
    <h1>Modifica disponibilità</h1>
    <form method="POST">
        <label for="nuova_disponibilita">Nuova disponibilità:</label>
        <input type="number" id="nuova_disponibilita" name="nuova_disponibilita" min="0" value="{{ prodotto.disponibilita }}">
        <input type="submit" value="Aggiorna">
    </form>
    <form action="/dashboard_venditore" method="post">
        <input type="submit" value="Torna alla home">
    </form>
</body>
