<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Aggiorna prodotto</title>
    <link rel="stylesheet" type="text/css" href="/static/registrazione.css">
</head>
<body>
    <h1>Modifica disponibilità </h1>
    <form method="POST">
        <div class="reg">
            <label for="nuova_disponibilita">Nuova disponibilità:</label>
            <input type="number" id="nuova_disponibilita" name="nuova_disponibilita" min="0" value="{{ prodotto.disponibilita }}">
            <br>
            <label for="nuovo_prezzo">Nuovo prezzo:</label>
            <input type="number" step="0.01" id="nuovo_prezzo" name="nuovo_prezzo" min="0.00" value="{{ prodotto.prezzo }}">
            <br>
            <input type="submit" class="registrati" value="Aggiorna">
        </div>
    </form>
    <form action="/dashboard_venditore" method="GET">
        <input type="submit" value="Torna alla home">
    </form>
</body>
</html>
