<!DOCTYPE html>
<html>
<head>
    <title>Crea Ordine</title>
</head>
<body>
    <h1>Crea Ordine</h1>
    <form method="POST">
        <label for="stato">Stato:</label><br>
        <input type="text" id="stato" name="stato"><br>
        <label for="data">Data:</label><br>
        <input type="date" id="data" name="data"><br>
        <label for="totale">Totale:</label><br>
        <input type="number" id="totale" name="totale" step="0.01"><br>
        <input type="submit" value="Crea">
    </form><br>
</body>
</html>
