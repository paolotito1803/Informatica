<!DOCTYPE html>
<html>
<head>
    <title>Aggiungi Prodotto</title>
</head>
<body>
    <h1>Aggiungi Prodotto</h1>
    <form method="POST">
        <label for="nome">Nome:</label><br>
        <input type="text" id="nome" name="nome"><br>
        <label for="descrizione">Descrizione:</label><br>
        <textarea id="descrizione" name="descrizione"></textarea><br>
        <label for="categoria">Categoria:</label><br>
        <input type="text" id="categoria" name="categoria"><br>
        <label for="prezzo">Prezzo:</label><br>
        <input type="number" id="prezzo" name="prezzo" step="0.01"><br>
        <label for="disponibilita">Disponibilità:</label><br>
        <input type="number" id="disponibilita" name="disponibilita"><br>
        <label for="marca">Marca:</label><br>
        <input type="text" id="marca" name="marca"><br>
        <label for="modello">Modello:</label><br>
        <input type="text" id="modello" name="modello"><br>
        <input type="submit" value="Aggiungi">
    </form>
    <br>
    <br>
    <form action="/dashboard_venditore" method="GET">
        <input type="submit" value="Torna alla home">
    </form>
</body>
</html>
