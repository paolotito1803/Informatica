<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <h1>Dashboard Venditore</h1>

    <form action="{{ url_for('dashboard_venditore') }}" method="post">
        <label for="name">Nome del prodotto:</label><br>
        <input type="text" id="name" name="name"><br>
        <label for="quantity">Quantità:</label><br>
        <input type="number" id="quantity" name="quantity"><br>
        <input type="submit" name="add" value="Aggiungi prodotto">
    </form>
    <h2>Prodotti</h2>
    <ul>
    {% for product in products %}
        <li>
            {{ product.name }} - {{ product.quantity }}
            <form action="{{ url_for('dashboard_venditore') }}" method="post">
                <input type="hidden" name="id" value="{{ product.id }}">
                <input type="submit" name="remove" value="Rimuovi prodotto">
            </form>
        </li>
    {% endfor %}
    </ul>
</body>
</html>
