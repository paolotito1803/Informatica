<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" type="text/css" href="/static/bottoni.css">
</head>
<body>
    <h1>Benvenuto, {{ utente.nome }}!</h1>
    <img src="/static/venditore.jpg" width="150">
    <form action="/aggiungi_prodotto">
        <input type="submit" class="input-verde" value="Aggiungi Prodotto">
    </form>
    <h2>Prodotti disponibili:</h2>
    <table>
        <tr>
            <th>Nome</th>
            <th>Descrizione</th>
            <th>Categoria</th>
            <th>Prezzo</th>
            <th>Disponibilità</th>
            <th>Immagine</th>
        </tr>
        {% for prodotto in prodotti %}
        <tr>
            <td>{{ prodotto.nome }}</td>
            <td>{{ prodotto.descrizione }}</td>
            <td>{{ prodotto.categoria }}</td>
            <td>{{ prodotto.prezzo }}</td>
            <td>{{ prodotto.disponibilita }}</td>
            <td><img src="{{ prodotto.immagine }}" width="150"></td>
            <td>
                <form action="{{url_for('rimuovi_prodotto', id = prodotto.id_Prodotti)}}" method="POST">
                    <input type="submit" class="input-rosso" value="Rimuovi">
                </form>
            </td>
            <td>
                <form action="{{url_for('aggiorna_prodotto', id = prodotto.id_Prodotti)}}" method="GET">
                    <input type="submit" class="input-blu" value="Aggiorna">
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>
    <br>
    <br>
    <form action="/profilo" method="GET">
        <input type="submit" value="Vai al profilo">
    </form>
</body>
</html>
