<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>carrello</title>
    <link rel="stylesheet" type="text/css" href="/static/bottoni.css">
</head>
<body>
     <img src="/static/carrello.jpg" width="150">
    <table>
        <tr>
            <th>Nome</th>
            <th>Descrizione</th>
            <th>Prezzo</th>
            <th>Quantità</th>
        </tr>
        {% for prodotto in carrello %}
        <tr>
            <td>{{ prodotto.nome }}</td>
            <td>{{ prodotto.descrizione }}</td>
            <td>{{ prodotto.prezzo }}</td>
            <td>{{ prodotto.quantita }}</td>
            <td>
                <form method="POST" action="{{url_for('rimuovi_dal_carrello', id_Prodotti = prodotto.id_Prodotti)}}">
                    <input type="submit" class="input-rosso" value="Rimuovi prodotto">
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>
    <h5>
        TOTALE : € {{ totale }}
    </h5>
    <form action="/crea_ordine" method="POST">
        <input type="submit" class="input-verde" value="Acquista">
    </form>
</body>
</html>
