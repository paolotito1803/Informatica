<!DOCTYPE html>
<html lang="">
<head>
    <title>Registrazione</title>
    <link rel="stylesheet" type="text/css" href="/static/registrazione.css">
</head>
<body>
    <h1>Registrazione</h1>
    <form action="/registrazione" method="POST">
        <div class="reg">
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email"><br>
            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password"><br>
            <label for="nome">Nome:</label><br>
            <input type="text" id="nome" name="nome"><br>
            <label for="indirizzo">Indirizzo:</label><br>
            <input type="text" id="indirizzo" name="indirizzo"><br>
            <label for="is_venditore">Sei un venditore?</label><br>
            <input type="checkbox" id="is_venditore" name="is_venditore"><br>
        </div>
        <div style="display: flex; justify-content: center">
            <input type="submit" class="registrati" value="Registrati">
        </div>
    </form>
</body>
</html>
